{% load static %}
<!-- Floating Founder Image Component -->
<div class="founder-floating-widget position-fixed" style="bottom: 20px; right: 20px; z-index: 1000;">
    <div class="card shadow-lg border-0" style="width: 280px; border-radius: 15px; overflow: hidden;">
        <div class="card-body p-3 bg-primary-green text-white text-center">
            <img src="{% static 'images/founder.png' %}" alt="Hon. Ismaila Muhammed Attah" 
                 class="rounded-circle mb-2" width="60" height="60" style="object-fit: cover; border: 3px solid #FFD700;">
            <h6 class="mb-1">Hon. Ismaila Muhammed Attah</h6>
            <small class="text-gold">Founder & Chairman</small>
            <p class="small mt-2 mb-2">"Together, we build stronger communities"</p>
            <a href="{% url 'about_founder' %}" class="btn btn-gold btn-sm">Learn More</a>
            <button class="btn-close btn-close-white position-absolute top-0 end-0 m-2" 
                    onclick="this.closest('.founder-floating-widget').style.display='none'" 
                    aria-label="Close"></button>
        </div>
    </div>
</div>

<style>
@media (max-width: 768px) {
    .founder-floating-widget {
        display: none !important;
    }
}
</style>
